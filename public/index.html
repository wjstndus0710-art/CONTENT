<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>마케팅 일지</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&family=Poppins:wght@400;500;600;700&display=swap"><link rel="stylesheet" href="/style.css"><script src="/app.js" defer></script></head><body>
<header><div class="brand"><span class="logo" aria-hidden="true"></span>마케팅 일지</div><div class="header-actions"><button class="secondary" id="restore">백업 복원</button><input type="file" id="restore-file" accept=".json,application/json" hidden><a href="/api/export" download>백업 내려받기</a></div></header>
<main>
<section class="intro"><div><p class="eyebrow">MARKETING JOURNAL</p><h1 id="today-title"></h1><p id="today-summary"></p></div><button id="add">＋ 오늘 할 일</button></section>
<section class="stats" aria-label="일지 현황">
<article><span>오늘 남은 할 일</span><strong id="stat-today">0</strong><small id="stat-today-sub"></small></article>
<article><span>이 주 완료율</span><strong id="stat-week">0%</strong><div class="meter"><i id="stat-week-bar"></i></div></article>
<article><span>이번 달 완료한 일</span><strong id="stat-month">0</strong><small id="stat-month-sub"></small></article>
<article><span>지난 7일 미완료</span><strong id="stat-overdue">0</strong><small>체크하거나 다음 날로 넘기세요</small></article>
</section>
<section class="top-grid">
<article class="card focus-card"><div class="week-nav"><button class="round" id="prev-week" aria-label="이전 주">←</button><div><p class="eyebrow">WEEKLY GOAL</p><strong id="week-label"></strong></div><button class="round" id="next-week" aria-label="다음 주">→</button><button class="secondary" id="this-week">이번 주</button></div><label for="week-focus">이 주 목표·메모</label><textarea id="week-focus" rows="4" maxlength="2000" placeholder="예: EDI 주 2회 업로드(월·목), 금요일에는 주제 탐색"></textarea><p class="hint" id="focus-status">입력 칸 밖을 누르면 저장됩니다.</p></article>
<article class="card mini-cal"><div class="mini-head"><button class="round" id="prev-month" aria-label="이전 달">‹</button><strong id="month-label"></strong><button class="round" id="next-month" aria-label="다음 달">›</button></div><div id="mini-grid" role="grid" aria-label="월간 달력"></div><p class="legend"><span class="dot"></span>할 일 남음 <span class="dot done"></span>모두 완료</p></article>
</section>
<section class="panel"><div class="panel-head"><div><h2>주간 보드</h2><p>할 일을 적고 Enter. 끝낸 일은 체크하고, 못 한 일은 → 버튼으로 다음 날로 넘기세요.</p></div><div class="filters"><input id="search" type="search" aria-label="일지 검색" placeholder="지난 일지 검색"><label class="inline"><input type="checkbox" id="show-weekend">주말 보기</label></div></div>
<p id="message" role="status"></p><div id="journal-days"></div><div id="journal-results" hidden></div></section>
<aside>엑셀 일지를 가져오면 할 일은 미완료로 시작합니다. 지난 날짜는 카드의 ‘모두 완료’로 한 번에 정리할 수 있습니다.</aside>
</main></body></html>
